# qlty: formatters, linters, security scanners and maintainability checks.
# Rules: docs/CODE-ARCHITECTURE.md#quality-tooling. Findings are fixed in code; never loosen rules without approval.
# Reference: https://qlty.sh/d/qlty-toml
config_version = "0"

# Only build output is excluded, so every source file is checked.
exclude_patterns = ["**/target/**"]

# Our test layout: unit tests in `foo/tests.rs`, integration tests in `tests/`.
test_patterns = ["**/tests.rs", "**/tests/**"]

[smells]
mode = "block"

[[source]]
name = "default"
default = true

# rustfmt and clippy are not qlty plugins here: qlty runs its own older Rust, so they run via
# cargo on the toolchain pinned in rust-toolchain.toml (lefthook, CI, rust-analyzer).

[[plugin]]
name = "gitleaks"
# renovate: datasource=github-releases depName=gitleaks/gitleaks
version = "8.29.1"

[[plugin]]
name = "osv-scanner"
# renovate: datasource=github-releases depName=google/osv-scanner
version = "2.3.0"

[[plugin]]
name = "semgrep"
# renovate: datasource=pypi depName=semgrep
version = "1.144.0"

[[plugin]]
name = "zizmor"
# renovate: datasource=pypi depName=zizmor
version = "1.16.3"

[[plugin]]
name = "actionlint"
# renovate: datasource=github-releases depName=rhysd/actionlint
version = "1.7.9"

[[plugin]]
name = "markdownlint"
# renovate: datasource=npm depName=markdownlint-cli
version = "0.46.0"

# qlty's definition still lists only linux/macos; semgrep CE supports Windows natively since the Fall 2025 release.
[plugins.definitions.semgrep]
supported_platforms = ["linux", "macos", "windows"]

# Our rules live in .semgrep/rules.yaml next to their test fixture (semgrep's documented layout).
[plugins.definitions.semgrep.drivers.lint]
script = "semgrep --metrics=off --disable-version-check --config .semgrep/rules.yaml --sarif --output=${tmpfile} ${target}"
success_codes = [0]
output = "tmpfile"
output_format = "sarif"
cache_results = true
batch = true
suggested = "config"
output_missing = "parse"

# The semgrep rule fixture is deliberately bad code; `semgrep --test` (CI) proves every rule still fires on it.
[[exclude]]
file_patterns = [".semgrep/**"]
plugins = ["semgrep"]
