[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/semoxide-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/semoxide/semoxide"

[workspace.dependencies]
# Internal crates (CODE-ARCHITECTURE §1); external dependencies are added by the tasks that need them.
semoxide-error = { path = "crates/semoxide-error", version = "0.0.0" }
semoxide-schema = { path = "crates/semoxide-schema", version = "0.0.0" }
semoxide-version-engine = { path = "crates/semoxide-version-engine", version = "0.0.0" }
semoxide-git = { path = "crates/semoxide-git", version = "0.0.0" }
semoxide-runtime = { path = "crates/semoxide-runtime", version = "0.0.0" }
semoxide = { path = "crates/semoxide", version = "0.0.0" }
semoxide-test-support = { path = "crates/semoxide-test-support" }

# External dependencies (pinned; bumped by Renovate).
clap = { version = "=4.6.7", features = ["derive"] }
criterion = "=0.8.2"
assert_cmd = "=2.2.2"
proptest = "=1.11.0"
rstest = "=0.27.0"
schemars = { version = "=1.2.2", default-features = false, features = ["std"] }
semver = "=1.0.28"
tempfile = "=3.27.0"
miette = { version = "=7.6.0", features = ["fancy"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
insta = "=1.49.0"
# Only the validator: no remote `$ref` resolution.
jsonschema = { version = "=0.58.6", default-features = false }
toml = "=1.1.6"

[workspace.lints.rust]
# `deny`, not `forbid`: semoxide-git's transport registration needs a scoped `#[expect(unsafe_code)]`.
# Every other crate adds `#![forbid(unsafe_code)]` in its root.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Code smells (nursery lint; limit in clippy.toml, default 25).
cognitive_complexity = "warn"
# Hygiene, as in uv/ruff and others (restriction/nursery lints, chosen one by one).
redundant_clone = "warn"
use_self = "warn"
exit = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
get_unwrap = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
or_fun_call = "warn"
needless_pass_by_ref_mut = "warn"
needless_collect = "warn"
str_to_string = "warn"
# Deterministic output: no iteration over hash maps and sets.
iter_over_hash_type = "warn"
# Rust rule 5: a `From` that can fail is a `TryFrom`.
fallible_impl_from = "warn"
# Module layout: `foo.rs` + `foo/`, no `mod.rs` (CODE-ARCHITECTURE, modules and files).
mod_module_files = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
