[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/semoxide-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/semoxide/semoxide"

[workspace.dependencies]
# Internal crates (CODE-ARCHITECTURE §1); external dependencies are added by the tasks that need them.
semoxide-error = { path = "crates/semoxide-error", version = "0.0.0" }
semoxide-schema = { path = "crates/semoxide-schema", version = "0.0.0" }
semoxide-version-engine = { path = "crates/semoxide-version-engine", version = "0.0.0" }
semoxide-git = { path = "crates/semoxide-git", version = "0.0.0" }
semoxide-runtime = { path = "crates/semoxide-runtime", version = "0.0.0" }
semoxide = { path = "crates/semoxide", version = "0.0.0" }
semoxide-test-support = { path = "crates/semoxide-test-support" }

# External dependencies (pinned; bumped by Renovate).
clap = { version = "=4.6.7", features = ["derive"] }
assert_cmd = "=2.2.2"
proptest = "=1.11.0"
rstest = "=0.27.0"
tempfile = "=3.27.0"
miette = { version = "=7.6.0", features = ["fancy"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
insta = "=1.49.0"

[workspace.lints.rust]
# `deny`, not `forbid`: semoxide-git's transport registration needs a scoped `#[expect(unsafe_code)]`.
# Every other crate adds `#![forbid(unsafe_code)]` in its root.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
