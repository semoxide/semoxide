# Newly published advisories reach us within a day, not only on the next PR.
name: deny-daily

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: hashFiles('crates/*/Cargo.toml') != ''
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          # renovate: datasource=crate depName=cargo-deny
          tool: cargo-deny@0.20.2
      - if: hashFiles('crates/*/Cargo.toml') != ''
        run: cargo deny --locked check advisories
