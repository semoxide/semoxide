# A pull request that changes a LOCKED test needs the maintainer's `tests-unlocked` label (rust-testing skill).
name: test-lock

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  test-lock:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'tests-unlocked') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No locked test changed
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: sh scripts/test-lock.sh "origin/$BASE_REF"
