# Quality gates and tests (docs/TESTING.md § CI, docs/CODE-ARCHITECTURE.md#quality-tooling).
# Branch protection requires only `required-checks`, which aggregates every job here.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  # Rust jobs run only when crates exist (#30) and something other than Markdown changed.
  # The workflow itself always runs, so the required `required-checks` always reports.
  detect:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.rust.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: rust
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          run=false
          if ls crates/*/Cargo.toml >/dev/null 2>&1; then
            run=true
            if [ "$EVENT" = "pull_request" ]; then
              # A failing diff fails the job (set -e) instead of silently skipping the tests.
              changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
              if ! printf '%s\n' "$changed" | grep -qv '\.md$'; then
                run=false
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install qlty
        env:
          # renovate: datasource=github-releases depName=qltysh/qlty
          QLTY_VERSION: 0.652.0
        run: |
          curl -fsSL https://qlty.sh | sh
          echo "$HOME/.qlty/bin" >> "$GITHUB_PATH"
      - name: qlty check (gitleaks, osv-scanner, semgrep, markdownlint, actionlint, zizmor, smells)
        run: qlty check --all --no-progress
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt (pinned toolchain)
        run: cargo fmt --all --check
      - name: clippy (pinned toolchain)
        run: cargo clippy --workspace --all-targets --locked
      - name: Every crate root except semoxide-git forbids unsafe code
        run: sh scripts/check-forbid-unsafe.sh
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: semgrep rule tests
        env:
          # renovate: datasource=pypi depName=semgrep
          SEMGREP_VERSION: 1.144.0
        run: uvx "semgrep@$SEMGREP_VERSION" --test --metrics=off --disable-version-check --config .semgrep/rules.yaml .semgrep/rules.rs

  deny:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          # renovate: datasource=crate depName=cargo-deny
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  test:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          # renovate: datasource=crate depName=cargo-nextest
          tool: cargo-nextest@0.9.146
      - run: cargo nextest run --workspace --locked --no-tests=warn
      - run: cargo test --doc --workspace --locked

  msrv:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          # renovate: datasource=crate depName=cargo-hack
          tool: cargo-hack@0.6.45
      - name: MSRV
        run: cargo hack check --rust-version --workspace --locked
      - name: Each feature
        run: cargo hack check --each-feature --workspace --locked

  required-checks:
    if: always()
    needs: [quality, deny, test, msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A required job ended with: $result"; exit 1 ;;
            esac
          done
