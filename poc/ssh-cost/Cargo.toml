[package]
name = "ssh-cost"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not part of any parent workspace.
[workspace]

# Exactly one of these per build (build with --no-default-features --features <v>).
[features]
default = []
https-only = []                                  # C: the floor (no SSH)
libssh2 = ["git2/ssh"]                           # A: git2 + libssh2
russh = ["dep:russh", "dep:ssh2-config", "dep:bytes", "dep:futures"] # B: git2 (no ssh) + russh transport
vendored-openssl = ["git2/vendored-openssl"]     # static musl builds

[dependencies]
# --- baseline the product already has ---
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "process", "macros"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "0.14"
prost = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
tracing = "0.1"
tracing-subscriber = "0.3"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "https"] }
# --- variant B only ---
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"], optional = true }
ssh2-config = { version = "0.8", optional = true }
bytes = { version = "1", optional = true }
futures = { version = "0.3", default-features = false, features = ["executor", "std"], optional = true }

[build-dependencies]
tonic-prost-build = "0.14"
protox = "0.9"

[profile.release]
strip = true
