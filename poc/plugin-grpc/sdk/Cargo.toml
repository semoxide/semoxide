[package]
name = "semoxide-plugin-sdk"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = []
# host-side launcher (spawn, process-tree kill, listener, client). Used by
# semoxide and by the conformance kit.
host = []

[dependencies]
semoxide-plugin-proto = { path = "../proto" }
tonic.workspace = true
prost.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
hyper-util.workspace = true
tower.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures-util.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Pipes"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
