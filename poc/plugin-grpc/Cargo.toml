[workspace]
resolver = "3"
members = ["proto", "sdk", "host", "plugin-demo", "conformance"]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false

[workspace.dependencies]
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
protox = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "fs"] }
tokio-stream = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
futures-util = "0.3"

[profile.release]
strip = true
