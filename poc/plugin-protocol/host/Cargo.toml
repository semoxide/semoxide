[package]
name = "semoxide-poc-host"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
wasmtime = { version = "49", optional = true }
wasmtime-wasi = { version = "49", optional = true }

[[bin]]
name = "semoxide-poc"
path = "src/bin/semoxide-poc.rs"
